<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#152830">
  <title>IQVideo · 互动控制台</title>
  <link rel="stylesheet" href="/static/console.css">
  <link rel="stylesheet" href="/static/library.css">
  <script type="module" src="/static/console.js"></script>
</head>
<body class="desk">
  <header class="mast">
    <div class="mast-inner">
      <div class="brand"><span class="brand-icon" aria-hidden="true"><i></i><i></i><i></i></span><span>IQ<span class="brand-light">Video</span></span></div>
      <span class="brand-separator"></span><span id="product"></span>
      <div class="global-tools">
        <div id="modes" class="segments on-dark"></div>
        <select id="language" aria-label="Language · 语言 · Langue"><option value="zh">简体中文</option><option value="en">English</option><option value="fr">Français</option></select>
      </div>
    </div>
  </header>
  <nav class="desk-nav"><div class="nav-inner"><div id="tabs"></div><span id="last-update" class="updated" role="status"></span></div></nav>
  <main class="desk-main">
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <div id="page"></div>
  </main>
  <dialog id="confirmation" aria-labelledby="confirm-title"><form method="dialog">
    <h2 id="confirm-title"></h2><p id="confirm-body"></p>
    <div class="dialog-actions"><button value="cancel" id="cancel"></button><button value="commit" id="commit" class="primary"></button></div>
  </form></dialog>
</body>
</html>
